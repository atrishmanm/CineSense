[pytest]
testpaths = tests
# Collect every test_*.py module. Live-server modules (test_features.py,
# test_ai_comprehensive.py, test_endpoints.py) self-skip when the server is
# unreachable, so `pytest -q` stays green offline.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
