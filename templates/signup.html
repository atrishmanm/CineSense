{% extends "base.html" %}

{% block title %}Sign Up - CineSense{% endblock %}

{% block content %}

<section class="container mx-auto px-6 py-20 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="bg-gray-900 rounded-2xl p-8 shadow-2xl">
            <h1 class="text-4xl font-bold text-center mb-2">Join CineSense</h1>
            <p class="text-center text-gray-400 mb-8">Start your AI-powered movie journey</p>
            
            <form id="signup-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2">Username</label>
                    <input type="text" id="username" required
                           class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-2">Email</label>
                    <input type="email" id="email" required
                           class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-2">Password</label>
                    <input type="password" id="password" required minlength="6"
                           class="w-full px-4 py-3 bg-gray-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-600">
                    <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
                </div>
                
                <div id="error-message" class="hidden p-4 bg-red-900/50 border border-red-600 rounded-lg text-sm">
                </div>
                
                <button type="submit" class="w-full py-4 bg-red-600 hover:bg-red-700 rounded-lg font-bold text-lg transition">
                    Create Account
                </button>
            </form>
            
            <p class="text-center text-gray-400 mt-6">
                Already have an account? 
                <a href="/login" class="text-red-600 hover:underline font-semibold">Login</a>
            </p>
        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        
        try {
            const response = await fetch('/api/user/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                window.location.href = '/compare';
            } else {
                errorDiv.textContent = data.error;
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            errorDiv.textContent = 'An error occurred. Please try again.';
            errorDiv.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
