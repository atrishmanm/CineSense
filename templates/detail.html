{% extends "base.html" %}

{% block title %}Movie Detail - CineSense{% endblock %}

{% block content %}

<section id="detail-loading" class="min-h-screen flex items-center justify-center">
    <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-red-600"></div>
</section>

<section id="detail-content" class="hidden">
    <!-- Backdrop -->
    <div class="relative h-screen">
        <div id="movie-backdrop" class="absolute inset-0 bg-cover bg-center"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-transparent"></div>
        
        <div class="relative z-10 container mx-auto px-6 h-full flex items-end pb-20">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full">
                <!-- Poster -->
                <div class="md:col-span-1">
                    <img id="movie-poster" src="" alt="" class="w-full rounded-2xl shadow-2xl">
                </div>
                
                <!-- Info -->
                <div class="md:col-span-2">
                    <h1 id="movie-title" class="text-6xl font-black mb-4"></h1>
                    
                    <div class="flex items-center space-x-6 mb-6 text-lg">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 text-yellow-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                            </svg>
                            <span id="movie-rating" class="text-2xl font-bold"></span>
                            <span id="movie-votes" class="text-gray-400 ml-2"></span>
                        </div>
                        <span id="movie-year" class="text-gray-300"></span>
                        <span id="movie-runtime" class="text-gray-300"></span>
                    </div>
                    
                    <div id="movie-genres" class="flex flex-wrap gap-2 mb-6"></div>
                    
                    <p id="movie-overview" class="text-xl text-gray-300 mb-8 max-w-3xl"></p>
                    
                    <!-- AI Explanation -->
                    <div id="ai-explanation" class="hidden mb-6 p-6 bg-black/50 rounded-xl border-2 border-red-600/30">
                        <h3 class="text-red-500 font-bold text-lg mb-2">🤖 Why We Recommend This</h3>
                        <p id="explanation-text" class="text-gray-300"></p>
                    </div>
                    
                    <!-- Metadata -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div id="director-section" class="hidden">
                            <h3 class="text-gray-400 text-sm font-semibold mb-2">DIRECTOR</h3>
                            <p id="movie-director" class="text-lg"></p>
                        </div>
                        <div id="cast-section" class="hidden">
                            <h3 class="text-gray-400 text-sm font-semibold mb-2">CAST</h3>
                            <p id="movie-cast" class="text-lg"></p>
                        </div>
                        <div>
                            <h3 class="text-gray-400 text-sm font-semibold mb-2">ELO SCORE</h3>
                            <p id="movie-elo" class="text-lg"></p>
                        </div>
                        <div>
                            <h3 class="text-gray-400 text-sm font-semibold mb-2">POPULARITY</h3>
                            <p id="movie-popularity" class="text-lg"></p>
                        </div>
                    </div>
                    
                    <!-- Actions -->
                    <div class="flex space-x-4">
                        <button onclick="watchMovie()" id="watch-btn" class="px-8 py-4 bg-red-600 hover:bg-red-700 rounded-lg font-bold text-lg transition flex items-center">
                            <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path>
                            </svg>
                            Watch Now
                        </button>
                        <button onclick="history.back()" class="px-8 py-4 bg-gray-800 hover:bg-gray-700 rounded-lg font-bold text-lg transition">
                            Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
    const movieId = {{ movie_id }};
    let currentMovie = null;
    
    document.addEventListener('DOMContentLoaded', async () => {
        await loadMovieDetail();
    });
    
    async function loadMovieDetail() {
        try {
            const response = await fetch(`/api/movie/${movieId}`);
            const data = await response.json();
            
            if (data.movie) {
                currentMovie = data.movie;
                displayMovie(data.movie, data.explanation);
            }
        } catch (error) {
            console.error('Error loading movie:', error);
            alert('Failed to load movie details');
        }
    }
    
    function displayMovie(movie, explanation) {
        const posterUrl = movie.poster_path 
            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
            : 'https://via.placeholder.com/500x750?text=No+Poster';
        
        const backdropUrl = movie.backdrop_path 
            ? `https://image.tmdb.org/t/p/original${movie.backdrop_path}`
            : posterUrl;
        
        document.getElementById('movie-backdrop').style.backgroundImage = `url('${backdropUrl}')`;
        document.getElementById('movie-poster').src = posterUrl;
        document.getElementById('movie-title').textContent = movie.title;
        document.getElementById('movie-rating').textContent = movie.tmdb_rating ? movie.tmdb_rating.toFixed(1) : 'N/A';
        document.getElementById('movie-votes').textContent = movie.vote_count ? `(${movie.vote_count.toLocaleString()} votes)` : '';
        document.getElementById('movie-year').textContent = movie.release_year || 'N/A';
        document.getElementById('movie-runtime').textContent = movie.runtime ? `${movie.runtime} min` : '';
        document.getElementById('movie-overview').textContent = movie.overview || 'No overview available.';
        document.getElementById('movie-elo').textContent = movie.elo_score || 1500;
        document.getElementById('movie-popularity').textContent = movie.popularity ? movie.popularity.toFixed(1) : 'N/A';
        
        // Genres
        if (movie.genres) {
            const genres = movie.genres.split(',').map(g => g.trim());
            document.getElementById('movie-genres').innerHTML = genres.map(genre => 
                `<span class="px-4 py-2 bg-red-600/20 border border-red-600 rounded-full text-sm font-semibold">${genre}</span>`
            ).join('');
        }
        
        // Director
        if (movie.directors) {
            document.getElementById('movie-director').textContent = movie.directors;
            document.getElementById('director-section').classList.remove('hidden');
        }
        
        // Cast
        if (movie.cast) {
            const cast = movie.cast.split(',').slice(0, 5).join(', ');
            document.getElementById('movie-cast').textContent = cast;
            document.getElementById('cast-section').classList.remove('hidden');
        }
        
        // AI Explanation
        if (explanation) {
            document.getElementById('explanation-text').textContent = explanation;
            document.getElementById('ai-explanation').classList.remove('hidden');
        }
        
        // Show content
        document.getElementById('detail-loading').classList.add('hidden');
        document.getElementById('detail-content').classList.remove('hidden');
    }
    
    function watchMovie() {
        if (currentMovie && currentMovie.watch_link) {
            window.open(currentMovie.watch_link, '_blank');
        } else {
            alert('Watch link not available for this movie');
        }
    }
</script>
{% endblock %}
