{% extends "base.html" %}

{% block title %}Movie Detail - CineSense{% endblock %}

{% block content %}

<section id="detail-loading" class="min-h-screen flex items-center justify-center">
    <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-indigo-600"></div>
</section>

<section id="detail-content" class="hidden">
    <!-- Hero Banner -->
    <div class="relative -mt-20 pt-20" style="height: calc(85vh + 5rem);">
        <div id="movie-backdrop" class="absolute inset-0 bg-cover bg-center bg-no-repeat"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-black via-black/60 to-transparent"></div>
        <div class="absolute bottom-0 left-0 right-0 h-40 bg-gradient-to-t from-gray-950 to-transparent"></div>
        
        <div class="relative z-10 h-full flex items-center">
            <div class="container mx-auto px-8 md:px-12">
                <div class="max-w-3xl space-y-3">
                    <h1 id="movie-title" class="text-4xl md:text-6xl font-black drop-shadow-2xl"></h1>
                    
                    <div class="flex flex-wrap items-center gap-3 text-sm md:text-base">
                        <div class="flex items-center bg-yellow-500 text-black px-2.5 py-1 rounded font-bold text-sm">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                            </svg>
                            <span id="movie-rating"></span>
                        </div>
                        <span id="movie-year" class="font-semibold"></span>
                        <span id="movie-runtime" class="text-gray-300"></span>
                        <div id="movie-genres" class="flex gap-2"></div>
                    </div>
                    
                    <p id="movie-overview" class="text-base md:text-lg text-gray-200 max-w-2xl line-clamp-2"></p>
                    
                    <!-- AI Explanation -->
                    <div id="ai-explanation" class="hidden p-3 bg-gradient-to-r from-indigo-900/50 to-transparent rounded-lg border-l-4 border-indigo-500 backdrop-blur-sm max-w-2xl">
                        <p class="text-xs md:text-sm text-gray-100">
                            <span class="text-indigo-400 font-semibold inline-flex items-center mr-2">
                                <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                                </svg>
                                Why We Recommend This
                            </span>
                            <span id="explanation-text" class="text-gray-200"></span>
                        </p>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex gap-3 pt-1">
                        <a id="watch-btn" href="#" target="_blank" class="px-5 py-2.5 bg-white text-black hover:bg-gray-200 rounded font-bold text-sm md:text-base transition flex items-center shadow-xl">
                            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path>
                            </svg>
                            Play
                        </a>
                        <button onclick="history.back()" class="px-5 py-2.5 bg-gray-600/80 hover:bg-gray-600 backdrop-blur-sm rounded font-semibold text-sm md:text-base transition flex items-center border border-gray-500/50">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                            </svg>
                            Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Sections -->
    <div class="bg-gray-950">
        <div class="container mx-auto px-8 md:px-12 py-12 space-y-12">
            
            <!-- Movie Info Card -->
            <div class="bg-gray-900/50 rounded-2xl p-8 border border-gray-800">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- Poster -->
                    <div class="flex justify-center">
                        <img id="movie-poster" src="" alt="" class="w-full max-w-sm rounded-xl shadow-2xl">
                    </div>
                    
                    <!-- Details -->
                    <div class="md:col-span-2 space-y-6">
                        <div>
                            <h2 class="text-2xl font-bold mb-4">About</h2>
                            <p id="movie-overview-full" class="text-gray-300 text-lg leading-relaxed"></p>
                        </div>
                        
                        <!-- Metadata Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div id="director-section" class="hidden">
                                <h3 class="text-gray-400 text-sm font-semibold mb-1">Director</h3>
                                <p id="movie-director" class="text-white"></p>
                            </div>
                            <div id="cast-section" class="hidden">
                                <h3 class="text-gray-400 text-sm font-semibold mb-1">Starring</h3>
                                <p id="movie-cast" class="text-white"></p>
                            </div>
                            <div>
                                <h3 class="text-gray-400 text-sm font-semibold mb-1">CineSense Score</h3>
                                <p id="movie-elo" class="text-white font-bold"></p>
                            </div>
                            <div>
                                <h3 class="text-gray-400 text-sm font-semibold mb-1">Popularity</h3>
                                <p id="movie-popularity" class="text-white"></p>
                            </div>
                            <div id="languages-section" class="hidden">
                                <h3 class="text-gray-400 text-sm font-semibold mb-1">Languages</h3>
                                <p id="movie-languages" class="text-white"></p>
                            </div>
                            <div id="votes-section">
                                <h3 class="text-gray-400 text-sm font-semibold mb-1">Votes</h3>
                                <p id="movie-votes" class="text-white"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Similar Movies -->
            <div id="similar-section" class="hidden">
                <h2 class="text-2xl md:text-3xl font-bold mb-6">More Like This</h2>
                <div id="similar-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4"></div>
            </div>
            
        </div>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script>
    const movieId = {{ movie_id }};
    let currentMovie = null;
    
    document.addEventListener('DOMContentLoaded', async () => {
        await loadMovieDetail();
        await loadSimilarMovies();
    });
    
    async function loadMovieDetail() {
        try {
            const response = await fetch(`/api/movie/${movieId}`);
            const data = await response.json();
            
            if (data.movie) {
                currentMovie = data.movie;
                displayMovie(data.movie, data.explanation);
            }
        } catch (error) {
            console.error('Error loading movie:', error);
            alert('Failed to load movie details');
        }
    }
    
    function displayMovie(movie, explanation) {
        const posterUrl = movie.poster_path 
            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
            : 'https://via.placeholder.com/500x750?text=No+Poster';
        
        const backdropUrl = movie.backdrop_path 
            ? `https://image.tmdb.org/t/p/original${movie.backdrop_path}`
            : posterUrl;
        
        document.getElementById('movie-backdrop').style.backgroundImage = `url('${backdropUrl}')`;
        document.getElementById('movie-poster').src = posterUrl;
        document.getElementById('movie-title').textContent = movie.title;
        document.getElementById('movie-rating').textContent = movie.tmdb_rating ? movie.tmdb_rating.toFixed(1) : 'N/A';
        document.getElementById('movie-year').textContent = movie.release_year || 'N/A';
        document.getElementById('movie-runtime').textContent = movie.runtime ? `${movie.runtime} min` : '';
        document.getElementById('movie-overview').textContent = movie.overview || 'No overview available.';
        document.getElementById('movie-overview-full').textContent = movie.overview || 'No overview available.';
        document.getElementById('movie-elo').textContent = movie.elo_score || 1500;
        document.getElementById('movie-popularity').textContent = movie.popularity ? movie.popularity.toFixed(1) : 'N/A';
        document.getElementById('movie-votes').textContent = movie.vote_count ? movie.vote_count.toLocaleString() : 'N/A';
        
        // Genres
        if (movie.genres) {
            const genres = movie.genres.split(',').map(g => g.trim());
            document.getElementById('movie-genres').innerHTML = genres.map(genre => 
                `<span class="px-3 py-1 bg-white/20 backdrop-blur-sm rounded text-sm font-semibold">${genre}</span>`
            ).join('');
        }
        
        // Director
        if (movie.directors) {
            document.getElementById('movie-director').textContent = movie.directors;
            document.getElementById('director-section').classList.remove('hidden');
        }
        
        // Cast
        if (movie.cast) {
            const castArray = movie.cast.split(',');
            const topCast = castArray.slice(0, 5).join(', ');
            document.getElementById('movie-cast').textContent = topCast;
            document.getElementById('cast-section').classList.remove('hidden');
        }
        
        // Watch link
        const watchBtn = document.getElementById('watch-btn');
        if (movie.watch_link) {
            watchBtn.href = movie.watch_link;
        } else {
            const searchQuery = encodeURIComponent(movie.title);
            watchBtn.href = `https://www.justwatch.com/us/search?q=${searchQuery}`;
        }
        
        // AI Explanation
        if (explanation) {
            document.getElementById('explanation-text').textContent = explanation;
            document.getElementById('ai-explanation').classList.remove('hidden');
        }
        
        // Show content
        document.getElementById('detail-loading').classList.add('hidden');
        document.getElementById('detail-content').classList.remove('hidden');
    }
    
    async function loadSimilarMovies() {
        try {
            const response = await fetch('/api/movie/top-rated?limit=12');
            const data = await response.json();
            
            if (data.movies && data.movies.length > 0) {
                // Filter out current movie
                const similar = data.movies.filter(m => m.movie_id !== movieId);
                document.getElementById('similar-container').innerHTML = 
                    similar.map(createStreamingCard).join('');
                document.getElementById('similar-section').classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error loading similar movies:', error);
        }
    }
    
    function createStreamingCard(movie) {
        const posterUrl = movie.poster_path 
            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
            : 'https://via.placeholder.com/500x750?text=No+Poster';
        const rating = movie.tmdb_rating ? movie.tmdb_rating.toFixed(1) : 'N/A';
        
        return `
            <div class="group cursor-pointer" onclick="window.location.href='/movie/${movie.movie_id}'">
                <div class="relative rounded-lg overflow-hidden aspect-[2/3] bg-gray-800 transform transition-all duration-300 group-hover:scale-105 group-hover:shadow-2xl group-hover:z-10">
                    <img src="${posterUrl}" alt="${movie.title}" class="w-full h-full object-cover" loading="lazy">
                    
                    <!-- Hover Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                        <div class="absolute bottom-0 left-0 right-0 p-4">
                            <div class="flex items-center justify-between mb-2">
                                <span class="flex items-center text-yellow-400 font-bold text-sm">
                                    <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                                    </svg>
                                    ${rating}
                                </span>
                                <span class="text-xs text-gray-300">${movie.release_year || ''}</span>
                            </div>
                            <h3 class="font-bold text-sm line-clamp-2">${movie.title}</h3>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
</script>
{% endblock %}
