{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-b from-gray-900 to-black">
    <div class="text-center px-4">
        <!-- 500 Icon -->
        <div class="mb-8">
            <svg class="mx-auto h-32 w-32 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
        </div>
        
        <!-- 500 Text -->
        <h1 class="text-9xl font-bold text-white mb-4">500</h1>
        <h2 class="text-3xl font-semibold text-white mb-4">Internal Server Error</h2>
        <p class="text-xl text-gray-400 mb-8 max-w-md mx-auto">
            Something went wrong on our end. Our team has been notified and is working to fix the issue.
        </p>
        
        <!-- Action Buttons -->
        <div class="flex gap-4 justify-center">
            <a href="/" class="inline-flex items-center px-6 py-3 bg-white text-black font-semibold rounded-md hover:bg-gray-200 transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Go Home
            </a>
            <a href="javascript:location.reload()" class="inline-flex items-center px-6 py-3 bg-gray-700 text-white font-semibold rounded-md hover:bg-gray-600 transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
