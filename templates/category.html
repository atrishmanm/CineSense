{% extends "base.html" %}

{% block title %}{{ category_title | default(genre | title, true) }} - CineSense{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white pt-24 px-4 md:px-8">
    <!-- Header -->
    <div class="max-w-7xl mx-auto mb-8">
        <h1 class="text-4xl md:text-5xl font-bold mb-2">
            {{ category_title | default(genre | title, true) }}
        </h1>
        <p class="text-gray-400">
            Discover movies and TV shows in this category
        </p>
    </div>

    <!-- Advanced Filters Section -->
    <div class="max-w-7xl mx-auto mb-8 bg-gray-800/50 backdrop-blur-sm rounded-xl p-6 border border-gray-700">
        <h2 class="text-xl font-semibold mb-4 flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
            </svg>
            Advanced Filters
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Media Type Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Media Type</label>
                <select id="mediaTypeFilter" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="all">Movies & TV Shows</option>
                    <option value="movie">Movies Only</option>
                    <option value="tv">TV Series Only</option>
                </select>
            </div>

            <!-- Year Range Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Year Range</label>
                <div class="flex gap-2">
                    <input type="number" id="yearFrom" placeholder="From" min="1900" max="2024" 
                           class="w-1/2 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <input type="number" id="yearTo" placeholder="To" min="1900" max="2024" 
                           class="w-1/2 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
            </div>

            <!-- Language Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Language</label>
                <select id="languageFilter" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="">All Languages</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="zh">Chinese</option>
                </select>
            </div>

            <!-- Sort By Filter -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Sort By</label>
                <select id="sortByFilter" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="popularity">Popularity</option>
                    <option value="rating">Rating</option>
                    <option value="release_date">Release Date</option>
                    <option value="title">Alphabetical</option>
                </select>
            </div>
        </div>

        <!-- Filter Action Buttons -->
        <div class="flex gap-3 mt-6">
            <button onclick="applyFilters()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white px-6 py-2 rounded-lg font-medium transition-all duration-200 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                Apply Filters
            </button>
            <button onclick="resetFilters()" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg font-medium transition-all duration-200 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                Reset
            </button>
        </div>
    </div>

    <!-- Results Count -->
    <div class="max-w-7xl mx-auto mb-4">
        <p id="resultsCount" class="text-gray-400">
            Loading...
        </p>
    </div>

    <!-- Movies Grid -->
    <div id="moviesGrid" class="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 mb-8">
        <!-- Movie cards will be dynamically loaded here -->
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="flex justify-center items-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-500 border-t-transparent"></div>
    </div>

    <!-- Load More Button -->
    <div class="max-w-7xl mx-auto text-center mb-12">
        <button id="loadMoreBtn" onclick="loadMore()" class="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-lg font-medium transition-all duration-200 hidden">
            Load More
        </button>
    </div>
</div>

<script>
    let currentPage = 0;
    let hasMore = true;
    let isLoading = false;

    // Get genre from URL or template variable
    const genre = "{{ genre | default('', true) | lower }}";
    const categoryName = "{{ category_name | default('', true) }}";

    // Function to create movie card HTML
    function createMovieCard(movie) {
        const posterPath = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : '/static/images/placeholder.jpg';
        const title = movie.title || 'Unknown Title';
        const rating = movie.tmdb_rating ? movie.tmdb_rating.toFixed(1) : 'N/A';
        const year = movie.release_date ? new Date(movie.release_date).getFullYear() : '';
        const movieId = movie.id || movie.tmdb_id;

        return `
            <div class="group cursor-pointer transform transition-all duration-300 hover:scale-105" onclick="window.location.href='/movie/${movieId}'">
                <div class="relative rounded-lg overflow-hidden shadow-lg bg-gray-800">
                    <img src="${posterPath}" alt="${title}" class="w-full aspect-[2/3] object-cover">
                    
                    <!-- Overlay on hover -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <div class="absolute bottom-0 left-0 right-0 p-3">
                            <h3 class="font-semibold text-sm mb-1 line-clamp-2">${title}</h3>
                            <div class="flex items-center justify-between text-xs text-gray-300">
                                <span>${year}</span>
                                <span class="flex items-center">
                                    <svg class="w-3 h-3 text-yellow-400 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                    </svg>
                                    ${rating}
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Rating badge (always visible) -->
                    <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-sm px-2 py-1 rounded-md flex items-center">
                        <svg class="w-3 h-3 text-yellow-400 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                        </svg>
                        <span class="text-xs font-semibold">${rating}</span>
                    </div>
                </div>
            </div>
        `;
    }

    // Function to load movies
    async function loadMovies(reset = false) {
        if (isLoading || (!hasMore && !reset)) return;
        
        isLoading = true;
        document.getElementById('loadingIndicator').style.display = 'flex';
        
        if (reset) {
            currentPage = 0;
            hasMore = true;
            document.getElementById('moviesGrid').innerHTML = '';
        }

        try {
            // Get filter values
            const mediaType = document.getElementById('mediaTypeFilter').value;
            const yearFrom = document.getElementById('yearFrom').value;
            const yearTo = document.getElementById('yearTo').value;
            const language = document.getElementById('languageFilter').value;
            const sortBy = document.getElementById('sortByFilter').value;

            // Build query parameters
            const params = new URLSearchParams({
                offset: currentPage * 20,
                limit: 20,
                media_type: mediaType,
                sort_by: sortBy
            });

            if (genre) params.append('genre', genre);
            if (yearFrom) params.append('year_from', yearFrom);
            if (yearTo) params.append('year_to', yearTo);
            if (language) params.append('language', language);

            const response = await fetch(`/api/movie/by-genre?${params}`);
            const data = await response.json();

            if (data.success && data.movies) {
                const moviesGrid = document.getElementById('moviesGrid');
                
                data.movies.forEach(movie => {
                    moviesGrid.innerHTML += createMovieCard(movie);
                });

                currentPage++;
                hasMore = data.movies.length === 20; // Has more if we got a full page
                
                // Update results count
                const totalResults = moviesGrid.children.length;
                document.getElementById('resultsCount').textContent = 
                    `Showing ${totalResults} ${totalResults === 1 ? 'result' : 'results'}`;

                // Show/hide load more button
                const loadMoreBtn = document.getElementById('loadMoreBtn');
                if (hasMore) {
                    loadMoreBtn.classList.remove('hidden');
                } else {
                    loadMoreBtn.classList.add('hidden');
                }
            } else {
                if (currentPage === 0) {
                    document.getElementById('moviesGrid').innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <svg class="w-16 h-16 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
                            </svg>
                            <p class="text-xl text-gray-400">No movies found</p>
                            <p class="text-gray-500 mt-2">Try adjusting your filters</p>
                        </div>
                    `;
                    document.getElementById('resultsCount').textContent = 'No results found';
                }
                hasMore = false;
            }
        } catch (error) {
            console.error('Error loading movies:', error);
            if (currentPage === 0) {
                document.getElementById('moviesGrid').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-xl text-red-400">Error loading movies</p>
                        <p class="text-gray-400 mt-2">Please try again later</p>
                    </div>
                `;
            }
        } finally {
            isLoading = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }

    function loadMore() {
        loadMovies(false);
    }

    function applyFilters() {
        loadMovies(true);
    }

    function resetFilters() {
        document.getElementById('mediaTypeFilter').value = 'all';
        document.getElementById('yearFrom').value = '';
        document.getElementById('yearTo').value = '';
        document.getElementById('languageFilter').value = '';
        document.getElementById('sortByFilter').value = 'popularity';
        loadMovies(true);
    }

    // Load initial movies on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadMovies(true);
    });
</script>
{% endblock %}
