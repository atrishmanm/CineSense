version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=cinesense
      - DB_PASSWORD=cinesense_password
      - DB_NAME=cinesense
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=cinesense
      - MYSQL_USER=cinesense
      - MYSQL_PASSWORD=cinesense_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
