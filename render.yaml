services:
  # Web Service (FREE TIER - 750 hours/month)
  - type: web
    name: cinesense-web
    runtime: python
    plan: free  # Explicitly use free plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app_integrated:create_app()" --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      # Use external free database - add these manually in Render dashboard
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

