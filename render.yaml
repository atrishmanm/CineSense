services:
  # Web Service (FREE TIER - 750 hours/month)
  - type: web
    name: cinesense-web
    runtime: python
    plan: free  # Explicitly use free plan
    buildCommand: pip install -r requirements.txt
    # Single worker (not 2): app_integrated.create_app() builds the ~10k-movie
    # semantic index and loads CLIP/transformers. Two workers would duplicate
    # that memory and double cold-start time. Prefer 1 worker + threads.
    startCommand: gunicorn "app_integrated:create_app()" --workers 1 --threads 4 --timeout 120
    envVars:
      # Keep 3.11.0 in sync with runtime.txt (python-3.11.0).
      # torch / sentence-transformers / faiss wheels must be re-verified for
      # any Python-version change before bumping this.
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      # Use external free database - add these manually in Render dashboard
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

